        <script>
            // Console interception - runs BEFORE any modules load
            (function() {
                var originalLog = console.log;
                var originalInfo = console.info;
                var originalWarn = console.warn;
                var originalError = console.error;

                function sendToParent(message, type) {
                    if (window.parent && window.parent !== window) {
                        try {
                            window.parent.postMessage({
                                type: type,
                                message: message,
                                timestamp: Date.now(),
                                source: "component-iframe"
                            }, "*");
                        } catch (e) {}
                    }
                }

                function argsToString(args) {
                    return Array.from(args).map(function(arg) {
                        if (arg instanceof Error) return "Error: " + arg.message;
                        if (typeof arg === "object" && arg !== null) {
                            try { return JSON.stringify(arg); } catch (e) { return String(arg); }
                        }
                        return String(arg);
                    }).join(" ");
                }

                console.log = function() {
                    sendToParent(argsToString(arguments), "CONSOLE_LOG");
                    return originalLog.apply(console, arguments);
                };

                console.info = function() {
                    sendToParent(argsToString(arguments), "CONSOLE_INFO");
                    return originalInfo.apply(console, arguments);
                };

                console.warn = function() {
                    var msg = argsToString(arguments);
                    if (msg.indexOf("React Router") === -1 && msg.indexOf("v7_") === -1 && msg.indexOf("cdn.tailwindcss") === -1) {
                        sendToParent(msg, "CONSOLE_WARN");
                    }
                    return originalWarn.apply(console, arguments);
                };

                console.error = function() {
                    sendToParent(argsToString(arguments), "CONSOLE_ERROR");
                    return originalError.apply(console, arguments);
                };

                window.__originalConsole = { log: originalLog, info: originalInfo, warn: originalWarn, error: originalError };
            })();
        </script>
        <script>
            // Element selection bridge - enables visual editor mode from parent
            (function() {
                var selectMode = false;
                var highlightOverlay = null;
                var lastTarget = null;

                function createOverlay() {
                    if (highlightOverlay) return highlightOverlay;
                    highlightOverlay = document.createElement("div");
                    highlightOverlay.id = "__select-overlay__";
                    highlightOverlay.style.cssText =
                        "position:fixed;pointer-events:none;border:2px solid #3b82f6;" +
                        "background:rgba(59,130,246,0.08);z-index:999999;transition:all 0.1s ease;" +
                        "border-radius:4px;display:none;";
                    var label = document.createElement("div");
                    label.id = "__select-label__";
                    label.style.cssText =
                        "position:absolute;top:-22px;left:0;background:#3b82f6;color:#fff;" +
                        "font-size:11px;padding:1px 6px;border-radius:3px 3px 0 0;" +
                        "font-family:monospace;white-space:nowrap;";
                    highlightOverlay.appendChild(label);
                    document.body.appendChild(highlightOverlay);
                    return highlightOverlay;
                }

                function positionOverlay(el) {
                    var ov = createOverlay();
                    var r = el.getBoundingClientRect();
                    ov.style.top = r.top + "px";
                    ov.style.left = r.left + "px";
                    ov.style.width = r.width + "px";
                    ov.style.height = r.height + "px";
                    ov.style.display = "block";
                    var tag = el.tagName.toLowerCase();
                    var cls = el.className && typeof el.className === "string"
                        ? "." + el.className.trim().split(/\s+/).slice(0, 2).join(".")
                        : "";
                    var id = el.id ? "#" + el.id : "";
                    ov.querySelector("#__select-label__").textContent = tag + id + cls;
                }

                function hideOverlay() {
                    if (highlightOverlay) highlightOverlay.style.display = "none";
                }

                function findComponentName(el) {
                    var node = el;
                    while (node && node !== document.body) {
                        var fiber = null;
                        for (var key in node) {
                            if (key.startsWith("__reactFiber$") || key.startsWith("__reactInternalInstance$")) {
                                fiber = node[key]; break;
                            }
                        }
                        if (fiber) {
                            var f = fiber;
                            while (f) {
                                if (f.type && typeof f.type === "function" && f.type.name
                                    && f.type.name !== "Fragment" && !f.type.name.startsWith("_")) {
                                    return f.type.name;
                                }
                                f = f.return;
                            }
                        }
                        node = node.parentElement;
                    }
                    return null;
                }

                function onMouseMove(e) {
                    if (!selectMode) return;
                    var t = e.target;
                    if (t === highlightOverlay || (highlightOverlay && highlightOverlay.contains(t))) return;
                    if (t === lastTarget) return;
                    lastTarget = t;
                    positionOverlay(t);
                }

                function onMouseClick(e) {
                    if (!selectMode) return;
                    e.preventDefault();
                    e.stopPropagation();
                    var t = e.target;
                    if (t === highlightOverlay || (highlightOverlay && highlightOverlay.contains(t))) return;
                    var compName = findComponentName(t);
                    var textContent = (t.textContent || "").trim().substring(0, 100);
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage({
                            type: "ELEMENT_SELECTED",
                            element: {
                                tagName: t.tagName.toLowerCase(),
                                id: t.id || null,
                                className: typeof t.className === "string" ? t.className : "",
                                textContent: textContent,
                                componentName: compName,
                            },
                            timestamp: Date.now(),
                            source: "component-iframe"
                        }, "*");
                    }
                }

                window.addEventListener("message", function(ev) {
                    if (ev.data && ev.data.type === "ENABLE_SELECT_MODE") {
                        selectMode = true;
                        document.body.style.cursor = "crosshair";
                        createOverlay();
                    }
                    if (ev.data && ev.data.type === "DISABLE_SELECT_MODE") {
                        selectMode = false;
                        document.body.style.cursor = "";
                        hideOverlay();
                        lastTarget = null;
                    }
                });

                document.addEventListener("mousemove", onMouseMove, true);
                document.addEventListener("click", onMouseClick, true);
            })();
        </script>
